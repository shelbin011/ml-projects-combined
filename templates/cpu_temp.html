{% extends 'base.html' %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">CPU Temperature Predictor</h1>
    <p class="page-subtitle">Simple Linear Regression model predicting server thermal output based on processor utilization levels.</p>
</div>

<div class="form-container">
    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label for="cpu_usage">CPU Usage (%)</label>
            <input type="number" step="0.1" name="cpu_usage" id="cpu_usage" class="form-control" placeholder="e.g. 75.5" required>
        </div>
        
        <button type="submit" class="btn" style="width: 100%; margin-top: 1rem;">Predict Temperature</button>
    </form>

    {% if prediction %}
    <div class="prediction-result">
        <div class="result-title">Predicted Temperature</div>
        <div class="result-value">{{ prediction }} °C</div>
    </div>
    {% endif %}
</div>
{% endblock %}
